name = "uno-game-server-ins"
main = "server/index.js"
compatibility_date = "2024-11-01"

# Worker ini sekaligus menyajikan file statis dari folder client/.
# Sebelumnya TIDAK ADA konfigurasi asset, sehingga index.html/app.js/style.css
# tidak pernah ter-deploy dan halaman hanya menghasilkan 404.
[assets]
directory = "./client"
binding = "ASSETS"

[observability]
enabled = true
